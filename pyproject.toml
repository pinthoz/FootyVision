[project]
name = "footyvision"
version = "0.1.0"
description = "AI football scouting platform — similarity, talent scoring and LLM scouting reports."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ana Pinto" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["football", "soccer", "scouting", "statsbomb", "machine-learning", "llm", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: FastAPI",
]

dependencies = [
    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # DB
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    # Config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Data / Aggregation
    "pandas>=2.2",
    "numpy>=1.26",
    # CLI
    "typer>=0.12",
    "rich>=13.7",
    # LLM (OpenAI-compatible HTTP client for local LM Studio / Ollama / Cloud)
    "httpx>=0.27",
    # ML: similarity, Performance Score, XGBoost position classifier + SHAP
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "shap>=0.45",
    # Value predictor: LightGBM regression + fuzzy name matching to FIFA/market values
    "lightgbm>=4.0",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
etl = [
    # Scraping / Extraction dependencies: not needed in API production runtime
    "statsbombpy>=1.13",
    "soccerdata>=1.8",
]
ml = [
    # Optional: UMAP 2D "player map" (visualisation only, Phase 1 stretch).
    "umap-learn>=0.5",
]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
    "statsbombpy>=1.13",
    "soccerdata>=1.8",
]

[project.urls]
Homepage = "https://github.com/pinthoz/FootyVision"
Repository = "https://github.com/pinthoz/FootyVision"
Issues = "https://github.com/pinthoz/FootyVision/issues"
Architecture = "https://github.com/pinthoz/FootyVision/blob/main/docs/ARCHITECTURE.md"

[project.scripts]
footyvision = "footyvision.cli:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# B008 is the intended FastAPI idiom (Depends()/Query() in argument defaults).
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
