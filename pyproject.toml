[project]
name = "footyvision"
version = "0.1.0"
description = "AI football scouting platform — similarity, talent scoring and LLM scouting reports."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ana Pinto" }]

dependencies = [
    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # DB
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    # Config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Data / ETL
    "pandas>=2.2",
    "numpy>=1.26",
    "statsbombpy>=1.13",
    # CLI
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "shap>=0.45",
    "umap-learn>=0.5",
]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
footyvision = "footyvision.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
